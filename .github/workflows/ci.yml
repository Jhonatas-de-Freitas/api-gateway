name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Integration tests skip themselves on a machine without Docker. Here that would hide a broken runner.
      - name: Refuse skipped tests
        run: |
          reports=$(ls target/*-reports/TEST-*.xml)
          if grep -L 'skipped="0"' $reports | grep .; then
            echo "::error::The reports above have skipped tests"
            exit 1
          fi

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: scripts/smoke-test.sh

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jhonatas-de-freitas/api-gateway
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMAGE"
